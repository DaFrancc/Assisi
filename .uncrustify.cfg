# Assisi source formatting: Allman braces, 4-space indent.
# Authoritative — run it with `make format`.
#
# Uncrustify rather than clang-format, which cannot format a lambda passed
# alongside other arguments without breaking the argument list and indenting the
# body out to the open paren (LLVM #55708, #59954, both open). Not AStyle, which
# aborts on adjacent-concatenated raw string literals — a construct this tree
# uses — and leaves a half-formatted tree behind when it does.
#
# code_width is deliberately unset: this reformats braces and indentation, it
# does not re-wrap lines.

indent_columns          = 4
indent_with_tabs        = 0

# Indent the body of a class. Off by default, which flattens every class to
# column 0.
indent_class            = true

# Allman: the brace goes on its own line.
nl_fdef_brace           = force
nl_if_brace             = force
nl_elseif_brace         = force
nl_else_brace           = force
nl_for_brace            = force
nl_while_brace          = force
nl_do_brace             = force
nl_switch_brace         = force
nl_class_brace          = force
nl_struct_brace         = force
nl_enum_brace           = force
nl_union_brace          = force
nl_namespace_brace      = force
nl_try_brace            = force
nl_catch_brace          = force
nl_brace_else           = force
nl_brace_while          = force

# One-line accessors are house style; the forces above would explode them all.
nl_func_leave_one_liners       = true
nl_class_leave_one_liners      = true
nl_enum_leave_one_liners       = true
nl_getset_leave_one_liners     = true
nl_cpp_lambda_leave_one_liners = true
nl_if_leave_one_liners         = true
nl_while_leave_one_liners      = true
nl_for_leave_one_liners        = true

# Bind to the name: `T *name`, not `T* name`.
sp_before_ptr_star      = force
sp_after_ptr_star       = remove
sp_between_ptr_star     = remove
sp_before_byref         = force
sp_after_byref          = remove

# Modern C++ spelling. Without these uncrustify writes C++03 — `std::tuple<> >`
# and `typename ... Ts` — across a tree that is variadic nearly everywhere.
sp_permit_cpp11_shift   = true
sp_angle_shift          = remove
sp_type_ellipsis        = remove
sp_ptr_type_ellipsis    = remove
sp_byref_ellipsis       = remove
sp_before_ellipsis      = remove
sp_parameter_pack_ellipsis = remove
sp_ellipsis_parameter_pack = force
